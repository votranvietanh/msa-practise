spring:
  application:
    name: catalog-service
  data:
    redis:
      host: localhost
      port: 6379
  # Không có REST controller nên không cần embedded web server - tắt hẳn để Spring Boot
  # khỏi cố mở port HTTP mặc định (8080) không ai dùng tới.
  main:
    web-application-type: none

grpc:
  server:
    port: 9090

# Cách kiểm tra JWT do auth-service phát (xem JwtDecoderConfig, JwtAuthInterceptor).
auth:
  issuer: http://localhost:8090
  jwk-set-uri: http://localhost:8090/oauth2/jwks
