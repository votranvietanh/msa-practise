server:
  port: 8082

spring:
  application:
    name: payment-service

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          # Khoá công khai của auth-service để verify chữ ký (tải lười ở request đầu tiên).
          jwk-set-uri: http://localhost:8090/oauth2/jwks
          # Chỉ nhận token do đúng issuer này phát hành.
          issuer-uri: http://localhost:8090

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# TTL cho key idempotency lưu trên Redis (xem InMemoryPaymentGateway).
# Sau khoảng thời gian này, key tự hết hạn - đủ dài để chống trùng do message bị
# redeliver (thường xảy ra trong vài giây/phút), không cần giữ mãi mãi tốn bộ nhớ Redis.
payment:
  idempotency-ttl: PT24H
